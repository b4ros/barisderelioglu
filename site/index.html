<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barış Derelioğlu | Yakında</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            animation: fadeIn 1.5s ease-out;
        }

        .status-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 48px;
        }

        .social-links {
            display: flex;
            justify-content: center;
        }

        .social-links a {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-main);
            text-decoration: none;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            border-bottom: 1px solid rgba(255, 255, 255, 1);
            color: var(--accent);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.8rem; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-text">Yenileniyor</div>
        <h1>Barış Derelioğlu</h1>
        <p class="subtitle">Dijital portfolyom ve güncel projelerim üzerinde çalışıyorum.<br>Kapsamlı çalışmalarım çok yakında burada erişime açılacaktır.</p>
        
        <div class="social-links">
            <a href="https://www.linkedin.com/in/barisderelioglu" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>
    </div>
</body>
</html>
